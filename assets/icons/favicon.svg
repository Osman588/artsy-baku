<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="spatialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="50%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="#0B0E1B"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- 3D chromatic streaks inspired by new Artsy Baku logo -->
  <path d="M42 12 L50 20 L24 46 L16 38 Z" fill="#FF2E93" filter="url(#glow)"/>
  <path d="M46 22 L52 28 L30 50 L24 44 Z" fill="#FFB703"/>
  <path d="M38 28 L44 34 L22 56 L16 50 Z" fill="#00E5FF"/>
  <!-- Central 'A' mark in chrome -->
  <text x="32" y="44" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.8))">A</text>
</svg>
